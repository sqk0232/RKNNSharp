name: managed

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: net10.0 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Directory.Build.props already selects net10.0. Passing -f on the
      # solution schedules each referenced project twice in parallel, and the
      # two writes race (CS2012 on Windows, MSB4018 on Linux). Pack is omitted:
      # the package requires librknnsharp_native.so from an RK3588 SDK build.
      - name: Build
        run: dotnet build RKNNSharp.slnx -c Release
      - name: Test
        run: dotnet test tests/RKNNSharp.Tests/RKNNSharp.Tests.csproj -c Release --no-build
