name: managed

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: net10.0 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Hosted runners build and run managed code only. Pack is omitted: the
      # net10.0 package requires librknnsharp_native.so from an RK3588 SDK build.
      - name: Build
        run: dotnet build RKNNSharp.slnx -c Release -f net10.0
      - name: Test
        run: dotnet test tests/RKNNSharp.Tests/RKNNSharp.Tests.csproj -c Release -f net10.0 --no-build
